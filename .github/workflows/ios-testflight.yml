name: iOS TestFlight

# Cloud build: GitHub-hosted macOS runner, no self-hosted machine involved.
# Unity is installed and licensed on the runner (Buildalon actions), generates the Xcode
# project, then xcodebuild archives, signs and uploads the build to TestFlight.
#
# macos-26 is pinned rather than macos-latest for two reasons: the app icon is an Apple
# Icon Composer .icon bundle, which needs Xcode 26 to compile, and a pinned image keeps
# builds reproducible when GitHub rolls -latest forward.
#
# Repository secrets (all already exist from the earlier cloud attempt):
#   UNITY_EMAIL          Unity ID email
#   UNITY_PASSWORD       Unity ID password
#   DIST_CERT_BASE64     Apple Distribution cert + private key, exported as .p12, base64
#   DIST_CERT_PASSWORD   password set when exporting that .p12
#   ASC_API_KEY_BASE64   App Store Connect API key (.p8), base64
#   ASC_KEY_ID           App Store Connect key id
#   ASC_ISSUER_ID        App Store Connect issuer id
#
# KEYCHAIN_PASSWORD is no longer used: the temporary keychain gets a random password
# generated on the runner, which is one less secret to keep in sync.
#
# Why this works where e0f09c9 did not: that attempt activated with
# `Unity -batchmode -serial -username -password`, which Unity's own manual says does NOT apply
# to Personal licenses ("To activate a license for Unity Personal, log in to the Unity Hub").
# The Buildalon action goes through the Hub / licensing client instead, which is the supported
# path for Personal. Note it still cannot answer a 2FA prompt, so the Unity account used here
# must not have two-factor enabled.

# CHI FA PARTIRE UNA BUILD
#
# Solo un merge su `dev`. Non i branch di feature, non `main`.
#
# Non e' una restrizione burocratica, e' il confine di fiducia: `workflow_dispatch` esegue la
# definizione del workflow presa DAL BRANCH da cui lo lanci, quindi un dispatch da un branch
# qualsiasi farebbe girare il file di quel branch — con i secret di firma Apple accanto. Legando la
# build a `dev`, l'unico modo di far girare codice di pipeline e' una PR su `dev`, che si vede.
#
# `workflow_dispatch` resta per ri-buildare `dev` o `main` a mano (un hotfix, una build persa). Cio'
# che lo rende sicuro NON e' questo commento: e' la regola sui branch dell'Environment `testflight`,
# che GitHub applica lato server e che nega i secret a qualunque altro ref.
#
# Un merge che tocca SOLTANTO documentazione non produce una build. Non e' un risparmio di minuti —
# su repo pubblica sono gratis — ma di CODA: i runner macOS in parallelo sono pochi, e con quattro
# persone al lavoro una correzione a un `.md` manderebbe in fila la build di chi sta invece
# aspettando davvero di provare qualcosa sul telefono. Kongball_DOCS sta fuori dal progetto Unity,
# quindi non puo' cambiare una riga dell'app.
#
# Attenzione: se un push contiene sia un `.md` sia del codice, la build parte. `paths-ignore` salta
# solo quando TUTTI i file modificati rientrano nell'elenco, che e' esattamente il comportamento
# giusto.
on:
  push:
    branches: [dev]
    paths-ignore:
      - '**/*.md'
      - 'Kongball_DOCS/**'
  workflow_dispatch: {}

# In coda, non annullate. Le build costano venti minuti e la tentazione e' annullare la precedente
# quando ne arriva una nuova — ma cosi' due merge ravvicinati diventano UNA build che contiene le
# cose di due persone, e nessuno sa piu' di chi e' la versione che sta provando. In coda ogni merge
# produce esattamente una build, quindi "una build = una PR = una persona", che e' precisamente cio'
# che serve al timbro dentro il gioco e al changelog nel gruppo.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  TEAM_ID: "9Z8F9Q282X"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    # Da creare in Settings > Environments, con "Deployment branches" limitato a dev e main, e i
    # secret Apple spostati dentro. Finche' non esiste, GitHub lo crea implicitamente senza regole e
    # i secret restano quelli del repo: il workflow funziona lo stesso, ma senza la protezione.
    environment: testflight
    # Narrowed on purpose: the only things this job needs the token for are cloning and asking which
    # branch a pull request came from.
    permissions:
      contents: read
      pull-requests: read
      actions: read        # per sapere qual era l'ultima build riuscita, e da li' il changelog
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Unity's asset import cache. The first run is cold and slow; later runs restore it
      # and skip reimporting every model and texture, which is most of the build time.
      #
      # PRIMA dei due passi che scrivono dentro Assets, e non dopo: la chiave e' l'hash di
      # Assets/**, quindi un file scritto prima di qui cambierebbe la chiave a ogni build e la
      # manderebbe a vuoto — oltre a farla divergere da quella di pr-check, che invece lavora
      # sull'albero pulito. Il timbro e l'AppId non entrano nella cache, e non serve che lo
      # facciano: sono due file che vengono riscritti comunque a ogni build.
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-
            Library-

      # Di chi e' questa build. Una build nasce da UN merge su `dev`, quindi dietro c'e' sempre una
      # pull request, e quella pull request ha un branch della forma nome/feature: e' esattamente
      # "autore e feature". Il numero della PR e' in coda al messaggio dello squash — "(#19)" — e da
      # li' si risale al branch.
      #
      # Non fa MAI fallire una build: e' un timbro. Se qualcosa non si risolve si ripiega sul nome del
      # ref, e nel caso peggiore il file resta vuoto e il menu semplicemente non mostra niente.
      - name: Timbro della build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          STAMP=""
          PR="$(git log -1 --pretty=%s | sed -n 's/.*(#\([0-9][0-9]*\))[[:space:]]*$/\1/p')"
          if [ -n "$PR" ]; then
            STAMP="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.ref 2>/dev/null || true)"
          fi
          if [ -z "$STAMP" ]; then STAMP="$GITHUB_REF_NAME"; fi
          printf '%s' "$STAMP" > Assets/Resources/BuildStamp.txt
          echo "Timbro della build: '$STAMP'"

      # L'AppId Photon fuori dal repo. E' committato in chiaro in una repo PUBBLICA: non da' accesso
      # al codice ne' agli account, ma chi lo legge puo' collegarsi al posto nostro e bruciare la
      # quota di giocatori connessi — cioe' far sembrare che il gioco sia rotto.
      #
      # Finche' il secret non esiste, avvisa e lascia il valore committato: la pipeline continua a
      # funzionare come prima. Quando l'AppId sara' stato ruotato e il secret configurato, il valore
      # nel repo va svuotato e lo script diventa bloccante.
      # L'impronta del netcode: due build si incontrano solo se questa combacia. Calcolata dai file
      # che decidono la compatibilita' di rete e non dal commit, cosi' due build che differiscono solo
      # per il menu possono ancora giocare insieme.
      - name: Impronta del netcode
        run: python3 .github/scripts/netcode_id.py

      - name: AppId Photon
        env:
          PHOTON_APP_ID: ${{ secrets.PHOTON_APP_ID }}
        run: python3 .github/scripts/photon_appid.py

      - name: Install Unity
        id: unity-setup
        uses: buildalon/unity-setup@v2
        with:
          version-file: 'ProjectSettings/ProjectVersion.txt'
          build-targets: 'iOS'
          architecture: 'arm64'
          cache-installation: true

      - name: Activate Unity license
        uses: buildalon/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          echo "Unity editor: $UNITY_EDITOR_PATH"
          UNITY="$UNITY_EDITOR_PATH"
          # unity-setup may hand back the .app bundle rather than the executable inside it.
          if [ -d "$UNITY" ]; then UNITY="$UNITY/Contents/MacOS/Unity"; fi

          "$UNITY" -quit -batchmode -nographics \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod KongBall.CmdBuild.IOSConfigured \
            -logFile -

          test -d "$GITHUB_WORKSPACE/Builds/iOS/Unity-iPhone.xcodeproj" \
            || { echo "::error::Unity did not generate the Xcode project"; exit 1; }

      # A hosted runner has an empty keychain, so the signing identity has to be imported.
      # This is the step the self-hosted Mac never needed: the cert lived in its login keychain.
      - name: Import signing certificate
        env:
          DIST_CERT_BASE64: ${{ secrets.DIST_CERT_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT="$RUNNER_TEMP/dist.p12"

          printf '%s' "$DIST_CERT_BASE64" | base64 --decode > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          # Let codesign and xcodebuild use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Make the temp keychain both visible and default to xcodebuild.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          rm -f "$CERT"

          echo "Identities available to codesign:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive + export + upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -version
          cd "$GITHUB_WORKSPACE/Builds/iOS"
          ARCH="$RUNNER_TEMP/KONGBALL.xcarchive"
          P8="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          rm -rf "$ARCH" "$RUNNER_TEMP/export"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><true/>
          </dict></plist>
          PLIST

          # The archive is built UNSIGNED, and exportArchive below signs the result for the App Store.
          #
          # Why: Unity generates the target with automatic signing and a development identity, so the
          # archive needed a development signing identity of its own — one Xcode had to create from
          # scratch on every fresh runner, because the keychain only holds the distribution
          # certificate. Apple caps development certificates at two per account, which is what failed
          # run 22 ("Your account has reached the maximum number of certificates") after runs 20 and
          # 21 had quietly used up both slots.
          #
          # Overriding CODE_SIGN_IDENTITY instead does not work, and run 23 is the proof: automatic
          # signing resolves everything to development and rejects the override outright — "Unity-iPhone
          # is automatically signed for development, but a conflicting code signing identity Apple
          # Distribution has been manually specified".
          #
          # Not signing the archive at all sidesteps the question: nothing is created on Apple's side,
          # and the only signature that ships is the one exportArchive applies with the certificate we
          # already import. Provisioning profiles, unlike certificates, are not capped.
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$ARCH" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="${TEAM_ID}" archive

          xcodebuild -exportArchive -archivePath "$ARCH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$P8" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -exportPath "$RUNNER_TEMP/export"

      # Leaves the signing identity behind on a shared runner otherwise; hosted runners are
      # destroyed after the job, but this keeps the workflow correct if it ever moves back
      # to a persistent machine.
      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

      # Un messaggio in gruppo: cosa e' cambiato rispetto all'ultima build riuscita, e di chi e'.
      #
      # `success() || failure()` e non `always()`: una build annullata non merita un messaggio, ma una
      # ROTTA si'. Su un `dev` condiviso e' meta' del valore — AGENTS.md dice che una build rossa e' di
      # chi ha mergiato e va sistemata subito, e un ping in gruppo lo rende immediato invece di
      # lasciarla trovare al prossimo che mergia.
      #
      # Non puo' far fallire la build: lo script trasforma qualunque problema in un avviso.
      - name: Avvisa il gruppo
        if: success() || failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Facoltativo come Telegram: manda a quelle configurate, e avvisa solo se non ce n'e' nessuna.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_FILE: ios-testflight.yml
        run: python3 .github/scripts/notify.py
