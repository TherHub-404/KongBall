name: iOS TestFlight

# Self-hosted runner on a Mac that already has Unity 6000.5.7f1 (logged-in / Personal license
# active), Xcode, and the Apple Distribution certificate in the login keychain.
# Push to main -> build the iOS Xcode project with Unity, sign, upload to TestFlight.
# No Unity install and no headless license activation (Personal can't be activated headlessly).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  UNITY_VERSION: "6000.5.7f1"
  TEAM_ID: "9Z8F9Q282X"

jobs:
  build:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build iOS Xcode project (Unity batchmode)
        run: |
          UNITY="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          "$UNITY" -quit -batchmode -nographics \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod KongBall.CmdBuild.IOSConfigured \
            -logFile -
          test -d "$GITHUB_WORKSPACE/Builds/iOS/Unity-iPhone.xcodeproj" || { echo "Xcode project not generated"; exit 1; }

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive + export + upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cd "$GITHUB_WORKSPACE/Builds/iOS"
          ARCH="$RUNNER_TEMP/KONGBALL.xcarchive"
          P8="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          rm -rf "$ARCH" "$RUNNER_TEMP/export"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><true/>
          </dict></plist>
          PLIST

          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$ARCH" -allowProvisioningUpdates \
            -authenticationKeyPath "$P8" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="${TEAM_ID}" archive

          xcodebuild -exportArchive -archivePath "$ARCH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$P8" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -exportPath "$RUNNER_TEMP/export"
