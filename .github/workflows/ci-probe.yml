name: CI probe

# Diagnostica usa-e-getta. Il workflow iOS fallisce in 3 secondi senza che venga
# assegnato alcun runner e senza tempo fatturabile, il che significa che il job
# viene rifiutato prima di partire e non produce log da leggere.
#
# Questi due job separano le due possibili cause:
#   - falliscono ENTRAMBI  -> problema di account (minuti esauriti o policy)
#   - passa ubuntu, fallisce macos -> problema specifico dei runner macOS
#
# Costo trascurabile: pochi secondi, e se la causa e' l'account non parte nulla.
# Da rimuovere una volta chiarito.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/ci-probe.yml']

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - run: echo "runner ubuntu raggiungibile"

  macos:
    runs-on: macos-26
    steps:
      - run: echo "runner macos raggiungibile"
