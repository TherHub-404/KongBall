name: PR check

# Compiles the project on every pull request — the gate this repository did not have.
#
# Until now the only compiler in the loop was the TestFlight build: twenty minutes away, and running
# only AFTER the merge. Two separate lots were broken that way, most recently by a two-argument call
# with the arguments in the wrong order, which took a four-feature merge down with it.
#
# Deliberately NOT a build. No player, no signing, no upload. Unity refuses to run -executeMethod
# when scripts have compiler errors and aborts batchmode non-zero, so invoking a method that does
# nothing is already a complete compile check.
#
# macOS with the iOS module, matching the release workflow exactly: Assets/Editor/CmdBuild.cs uses
# UnityEditor.iOS.Xcode, so a checker without that module would fail to compile code that is fine.
# Matching the release environment is the whole point — a green check somewhere else proves nothing.

# `dev` e' dove arrivano le feature, `main` e' cio' che e' gia' stato provato: la porta di ingresso
# va sorvegliata su entrambe.
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

concurrency:
  group: pr-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true      # a new push supersedes the check still running on the old one

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Two seconds, and it is the protocol's only mechanical check: a branch carries the name of the
      # person working on it, so that a feature, a build and a bug report can always be traced back to
      # somebody. Skipped for pull requests from forks, whose branch names are outside this agreement.
      - name: Branch name
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # `dev` is the one branch that legitimately opens a pull request without a person's name on
          # it: promoting dev into main. Every other head branch belongs to somebody.
          if [ "$BRANCH" = "dev" ]; then echo "Promozione da dev: ok."; exit 0; fi
          if ! printf '%s' "$BRANCH" | grep -Eq '^[a-z][a-z0-9]*(-[a-z0-9]+)*/[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo "::error::Il branch si chiama '$BRANCH'. Matteo vuole 'nome/feature-in-kebab-case' —"
            echo "::error::minuscolo, senza accenti, senza underscore. Esempi: luca/portiere-automatico"
            exit 1
          fi
          echo "Branch '$BRANCH' ok."

      # Una pull request che tocca soltanto documentazione non puo' rompere la compilazione, e farle
      # aspettare sette minuti di Unity ruba il runner a chi ne ha davvero bisogno.
      #
      # Ma il job deve girare SEMPRE e riportare il suo esito: `check` e' un controllo obbligatorio
      # nel ruleset, e un workflow saltato da `paths-ignore` non riporta NIENTE — la pull request
      # resterebbe bloccata per sempre in attesa di una spunta che non arriva mai. Quindi non si salta
      # il job: si saltano gli step costosi, e la spunta arriva comunque in pochi secondi.
      #
      # Questo step decide anche il caso del fork, che prima era duplicato in tre `if` identici: una
      # pull request da un fork non riceve le credenziali Unity, quindi la compilazione non e'
      # saltata per scelta ma perche' non e' possibile — e ora il motivo e' scritto nel log una volta
      # sola, dove lo si legge.
      - name: Serve Unity?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR: ${{ github.event.number }}
        run: |
          set -uo pipefail
          say() { echo "unity=$1" >> "$GITHUB_OUTPUT"; echo "$2"; }

          if [ "$EVENT" != "pull_request" ]; then
            say true "Non e' una pull request: compilo."; exit 0
          fi
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            say false "Pull request da un fork: GitHub non le consegna le credenziali Unity, quindi la compilazione non e' possibile. Restano i controlli sugli asset."; exit 0
          fi

          FILES="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' 2>/dev/null || true)"
          if [ -z "$FILES" ]; then
            say true "Non ho l'elenco dei file: compilo per prudenza."; exit 0
          fi
          echo "File toccati:"; printf '%s\n' "$FILES" | sed 's/^/  /'
          if printf '%s\n' "$FILES" | grep -Eq '^(Assets/|Packages/|ProjectSettings/)'; then
            say true "Toccato il progetto Unity: compilo."
          else
            say false "Nessun file del progetto Unity: salto la compilazione."
          fi

      # Seconds, and no Unity involved. Every one of these is a mistake that actually shipped here:
      # a script committed without its .meta, a duplicated GUID, a Resources.Load name with no asset
      # behind it — which fails silently at runtime and looks like a missing model.
      - name: Asset sanity
        run: python3 .github/scripts/asset_sanity.py

      # Gli invarianti del repo, accanto all'integrita' degli asset: nessun segreto committato,
      # l'AppId Photon e il timbro vuoti, i flag dei NetworkObject al loro valore, nessuno shader
      # integrato che URP butta fuori dalla build. Ogni controllo corrisponde a un guasto che qui e'
      # gia' costato qualcosa, e ognuno e' stato provato anche NEL VERSO CHE FALLISCE.
      - name: Invarianti del repo
        run: python3 .github/scripts/repo_lint.py

      # Anche la cache: e' grossa, e ripristinarla per poi non compilare e' tempo di runner buttato.
      - name: Cache Unity Library
        if: steps.scope.outputs.unity == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-
            Library-

      # Tutto quello che segue gira solo se lo step "Serve Unity?" ha detto di si'. Saltato e non
      # fallito: una PR di sola documentazione, o da un fork, ottiene comunque i controlli sugli asset
      # e una spunta verde onesta, invece di un tick rosso su cui nessuno puo' agire.
      - name: Install Unity
        if: steps.scope.outputs.unity == 'true'
        uses: buildalon/unity-setup@v2
        with:
          version-file: 'ProjectSettings/ProjectVersion.txt'
          build-targets: 'iOS'
          architecture: 'arm64'
          cache-installation: true

      # Note: this activates the same Personal licence the release build uses. If a PR check and a
      # TestFlight build ever overlap and the activation is refused, that is why — the fix is to
      # serialise the two workflows on a shared concurrency group.
      - name: Activate Unity license
        if: steps.scope.outputs.unity == 'true'
        uses: buildalon/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Compile scripts
        if: steps.scope.outputs.unity == 'true'
        run: |
          set -euo pipefail
          UNITY="$UNITY_EDITOR_PATH"
          # unity-setup may hand back the .app bundle rather than the executable inside it.
          if [ -d "$UNITY" ]; then UNITY="$UNITY/Contents/MacOS/Unity"; fi

          "$UNITY" -quit -batchmode -nographics \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod KongBall.CmdBuild.CompileOnly \
            -logFile -
